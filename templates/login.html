<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Login</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#111827;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            background:white;
            padding:40px;
            border-radius:15px;
            width:380px;
            text-align:center;
        }

        h2{
            margin-bottom:10px;
        }

        p{
            color:gray;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:8px;
            box-sizing:border-box;
        }

        .role-selection{
            text-align:left;
            margin-top:10px;
            margin-bottom:15px;
        }

        .role-selection label{
            margin-right:20px;
        }

        button{
            width:100%;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            margin-top:10px;
        }

        button:hover{
            background:#1d4ed8;
        }

        .register-link{
            margin-top:15px;
        }

        .register-link a{
            color:#2563eb;
            text-decoration:none;
            font-weight:bold;
        }

    </style>

</head>
<body>

    <div class="login-box">

        <h2>Expense Tracker</h2>

        <p>Login to continue</p>

        <form method="POST">

            <input type="text"
                   name="username"
                   placeholder="Username"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <div class="role-selection">

                <strong>Login As:</strong><br><br>

                <label>
                    <input type="radio"
                           name="role"
                           value="user"
                           checked>
                    User
                </label>

                <label>
                    <input type="radio"
                           name="role"
                           value="admin">
                    Admin
                </label>

            </div>

            <button type="submit">Login</button>

        </form>

        <div class="register-link">

            Don't have an account?

            <a href="/register">Register Here</a>

        </div>

    </div>

</body>
</html>
